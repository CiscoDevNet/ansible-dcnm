# NaC-rendered dcnm_interface arguments (nac_pr895_pvlan_args, data) and the PVLAN host port-channel models
# (verbatim YAML text; the sha256 is the hash of that text).
sources:
  vars_po_host_e1:
    file: pvlan_po_host_models/vars_po_host_e1.yml
    sha256: 68a9e5aa00d029aabcf6bc36e1cf931e32aec255badc92622c82ba48cc3492a0
  M1_po_host_create:
    file: pvlan_po_host_models/M1_po_host_create.yml
    sha256: 9f88c4b404983158423a87b2eafb1a256180ded23681f7fd3b65644976c72623
  M2_po_host_repeat:
    file: pvlan_po_host_models/M2_po_host_repeat.yml
    sha256: f1ea33eba6fcf5a2332da2d0dae1ef31a64f97ecb9916d4eb3de8bf538bfc94b
  nac_pr895_pvlan_args:
    file: nac_pr895_pvlan_args.json
    sha256: ad011b24721f811e5e453e5b0c626406252716a9439f303f3949bedbab5ef256
cases:
  nac_pr895_pvlan_args:
    _source: NaC PR895 6c7a6c1b offline render (validate + dtc.common, synthetic credentials, no controller) of the customer base model plus a minimal PVLAN overlay; resource_data.interface_all create list (create phase, state replaced) entries with mode pvlan.
    create_pvlan:
    - deploy: false
      name: po581
      profile:
        admin_state: false
        bpdu_guard: true
        copy_description: false
        description: NetAsCode PVLAN Port-Channel Interface
        disable_lacp_suspend_individual: false
        duplex: auto
        enable_cdp: true
        lacp_port_priority: 32768
        lacp_rate: normal
        members:
        - Ethernet1/9
        - Ethernet1/10
        mode: pvlan
        mtu: jumbo
        pc_mode: active
        port_type_fast: true
        pvlan_association:
        - primary_vlan: 2210
          secondary_vlan: 2212
        pvlan_mode: host
        speed: auto
      switch:
      - 192.168.1.102
      type: pc
    - deploy: false
      name: vpc583
      profile:
        admin_state: false
        bpdu_guard: true
        copy_description: false
        disable_lacp_suspend_individual: false
        duplex: auto
        enable_cdp: true
        enable_lacp_vpc_convergence: false
        enable_pfc: false
        enable_qos: false
        lacp_port_priority: 32768
        lacp_rate: normal
        mode: pvlan
        mtu: jumbo
        pc_mode: active
        peer1_cmds: ''
        peer1_description: NetAsCode PVLAN Port-Channel Interface
        peer1_members:
        - Ethernet1/9
        - Ethernet1/10
        peer1_pcid: 583
        peer2_cmds: ''
        peer2_description: NetAsCode PVLAN Port-Channel Interface
        peer2_members:
        - Ethernet1/9
        - Ethernet1/10
        peer2_pcid: 583
        port_type_fast: true
        pvlan_association:
        - primary_vlan: 2210
          secondary_vlan: 2212
        pvlan_mode: host
        speed: auto
      switch:
      - 192.168.1.103
      - 192.168.1.104
      type: vpc
  vars_po_host_e1:
    sha256: 68a9e5aa00d029aabcf6bc36e1cf931e32aec255badc92622c82ba48cc3492a0
    text: |
      # NOT RUN. PLACEHOLDERS ONLY. No real resource is selected or reserved by this file; dedicated
      # resources must be assigned and recorded (with a backup) BEFORE any live use. The VLANs
      # (2210 primary / 2212 isolated) are the Ethernet case's candidates and are NOT validated here; they are literal in the models so argument types do not depend on templating.
      po_fabric: "<FABRIC>"
      po_switch: "<SWITCH_MANAGEMENT_IP>"
      po_name: "<PORT_CHANNEL_NAME, for example po10, a number that is free on the switch>"
      po_member: "<DEDICATED_PHYSICAL_PORT, for example Ethernet1/x: existing, administratively shutdown, free of another Po/overlay/freeform>"
  M1_po_host_create:
    sha256: 9f88c4b404983158423a87b2eafb1a256180ded23681f7fd3b65644976c72623
    text: |
      # M1 -- NOT RUN. NOT LIVE TESTED.
      # Offline status: the argspec, payload and pre-deploy gate exist and pass the focused offline tests; the
      # first live run is what measures the controller's behaviour for a port-channel.
      #
      # Future check chain (to be recorded by a live run, per step):
      #   model -> module args -> payload (POST globalInterface) -> parent intent + child intent
      #         -> config-preview (forceShowRun=true, `!Time:` freshness) -> device CLI (Po and member)
      #
      # Required BEFORE any live use (none of these is done here):
      #   1. source pin: dcnm_interface.py / interface_pvlan.py sha256 == the pins in the delivery manifest;
      #   2. model pin: this file's sha256 == the manifest;
      #   3. local validation: the focused test file passes in the pinned tree;
      #   4. DEDICATED resources assigned by the operator (see vars_po_host_e1.yml), the member ALREADY in
      #      administrative shutdown with an int_trunk_host baseline policy, free of another Po, overlay and
      #      freeform CONF (the member template would otherwise bring it up: its ADMIN_STATE is inherited);
      #   5. backup of the member's intent (GET interface by serial+name) and CLI (show running-config of the
      #      member) and proof that the port-channel does not exist;
      #   6. a concrete cleanup agreed in advance (state: deleted and manual alternative are NOT implemented here).
      - name: M1 PVLAN host port-channel, creation
        hosts: ndfc
        gather_facts: false
        vars_files: [vars_po_host_e1.yml]
        tasks:
          - name: M1 create one port-channel in PVLAN host mode with ONE dedicated member (admin shutdown)
            cisco.dcnm.dcnm_interface:
              fabric: "{{ po_fabric }}"
              state: replaced
              config:
                - name: "{{ po_name }}"
                  type: pc
                  switch: ["{{ po_switch }}"]
                  deploy: true
                  profile:
                    mode: pvlan
                    pvlan_mode: host
                    members: ["{{ po_member }}"]
                    pc_mode: active
                    admin_state: false
                    pvlan_association: [{primary_vlan: 2210, secondary_vlan: 2212}]  # CANDIDATE pair, not validated
  M2_po_host_repeat:
    sha256: f1ea33eba6fcf5a2332da2d0dae1ef31a64f97ecb9916d4eb3de8bf538bfc94b
    text: |
      # M2 -- NOT RUN. NOT LIVE TESTED. The IDENTICAL model of M1, to be run after a verified M1.
      # Acceptance is NOT "changed is false": it is the REAL number of writes (module log with LOG_PATH
      # configured; len(response) counts recorded answers, not HTTP attempts) plus the unchanged parent and
      # child intent and an unchanged device CLI. Same preconditions as M1.
      - name: M2 PVLAN host port-channel, identical repetition
        hosts: ndfc
        gather_facts: false
        vars_files: [vars_po_host_e1.yml]
        tasks:
          - name: M2 repeat the M1 model unchanged
            cisco.dcnm.dcnm_interface:
              fabric: "{{ po_fabric }}"
              state: replaced
              config:
                - name: "{{ po_name }}"
                  type: pc
                  switch: ["{{ po_switch }}"]
                  deploy: true
                  profile:
                    mode: pvlan
                    pvlan_mode: host
                    members: ["{{ po_member }}"]
                    pc_mode: active
                    admin_state: false
                    pvlan_association: [{primary_vlan: 2210, secondary_vlan: 2212}]  # CANDIDATE pair, not validated
