##############################################
##               SETUP                      ##
##############################################

# Management interfaces are physical interfaces which always exist on the
# switch. They can be created and modified but they cannot be deleted. This
# test verifies that 'deleted' state reports the interface as skipped and
# makes no changes on the controller.

- name: Skip MGMT tests if mgmt_switch is not defined
  ansible.builtin.meta: end_play
  when: >
    test_data_common.mgmt_switch is not defined or
    test_data_common.mgmt_switch == ""

- name: MGMT DELETE - Test Entry Point - [ndfc_interface]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+              Executing Tests - [ndfc_interface]               +"
      - "+                     MGMT DELETE Tests                         +"
      - "----------------------------------------------------------------"

- name: Remove local log file
  ansible.builtin.command: rm -f dcnm_intf.log
  delegate_to: localhost

- block:
    ##############################################
    ##                DELETE                    ##
    ##############################################

    - name: Delete management interface
      cisco.dcnm.dcnm_interface:
        check_deploy: false
        fabric: "{{ test_data_common.fabric }}"
        state: deleted
        config:
          - name: mgmt0
            switch:
              - "{{ test_data_common.mgmt_switch }}"
      register: result

    - name: ASSERT - Verify management interface was not deleted
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - 'result.diff[0]["deleted"] | length == 0'
          - 'result.diff[0]["delete_deploy"] | length == 0'
          - 'result.diff[0]["replaced"] | length == 0'
        fail_msg: "Management interface must never be deleted - {{ result }}"
        success_msg: "Management interface was correctly left untouched"

    - name: ASSERT - Verify the interface was reported as skipped
      vars:
        skip_reason: "Management interfaces cannot be deleted"
      ansible.builtin.assert:
        that:
          - 'result.diff[0]["skipped"] | length == 1'
          - 'result.diff[0]["skipped"][0]["Name"] == "Mgmt0"'
          - 'result.diff[0]["skipped"][0]["Reason"] == skip_reason'
        fail_msg: "Management interface skip reason is missing - {{ result }}"
        success_msg: "Management interface was correctly reported as skipped"
