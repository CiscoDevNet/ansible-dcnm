# Registry slice 0b_41 -- PIM sparse mode and DR priority on the routed port-channel (int_l3_port_channel, `type: pc`,
# `mode: l3`). Two bindings, the keys and contracts of the int_routed_host rows in slice 0b_31.
#
#     int_l3_port_channel  ENABLE_PIM_SPARSE  enable_pim_sparse  reset "false"
#     int_l3_port_channel  PIM_DR_PRIORITY    pim_dr_priority    reset "1"
#
# Source: the int_l3_port_channel body served with SMU 4.3.1.0175006017 (template REST API, read only), sha256 of
# `content` 81c9392e92a488977d2a5c22fd2f79797fa826ff28b89d536d087fc8f9afe655:
#     L144   boolean ENABLE_PIM_SPARSE { defaultValue=false; }
#     L149   long PIM_DR_PRIORITY { min = 1; max = 4294967295; defaultValue = 1; }
#     L623   enablePimSparse = ENABLE_PIM_SPARSE, "false" on error
#     L628   pimDrPriority = PIM_DR_PRIORITY, "1" on error
#     L1201  if enablePimSparse == "true": createOrUpdate(... "pim_interface" ...)
#     L1208  if pimDrPriority != "" and pimDrPriority != "1": createOrUpdate(... "interface_pim_dr_priority" ...)
# The declarations differ from the int_routed_host ones only by display metadata (Section="PIM"); type, bounds and
# default are the same, so the routed contract applies: priority 1 is both the lower bound and the value that creates
# no child, and the registry type is `integer` (`long` is not an engine validator type; see slice 0b_31).
#
# INDEPENDENT FIELDS. No IsShow, error report or gate relates them; the body can render a DR priority without sparse
# mode. Whether NX-OS accepts that is a device question the body does not answer.
#
# Removal: neither branch deletes its child. add() calls delete(True) (L1015), which deletes every child of the
# port-channel, then recreates only those the current values select, so a reset to "false" or "1" should leave no
# child. removal_semantics stays unresolved: nothing here is measured live.

shared_effects: []

bindings:

  - parent_template: int_l3_port_channel
    parent_nvpair: ENABLE_PIM_SPARSE
    profile_key: enable_pim_sparse
    applicable_interface_type: pc
    applicable_mode: l3
    type: boolean
    reset_wire: 'false'
    default_template: false
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: "12.6.0.267"
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: "int_l3_port_channel.template@81c9392e#L144"

  - parent_template: int_l3_port_channel
    parent_nvpair: PIM_DR_PRIORITY
    profile_key: pim_dr_priority
    applicable_interface_type: pc
    applicable_mode: l3
    type: integer
    min: 1
    max: 4294967295
    reset_wire: '1'
    default_template: 1
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: "12.6.0.267"
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: "int_l3_port_channel.template@81c9392e#L149"
