  #
  # Not the loopback case: retired slice 0b_10 (int_fabric_loopback_11_1) was withdrawn because fabric
  # loopback auth is underlay auth owned by fabricSettings. On these parents it is self-contained on the
  # interface, which is why the two global validators that blocked it were removed.
  #
  # no_log: only OSPF_AUTH_KEY and OSPF_AUTHENTICATION_KEY carry key material (the only `no_log: true` rows
  # in the registry). The key ID and encryption-type selector are not marked: Ansible scrubs by string
  # match, so marking a value like "1" or "7" would corrupt unrelated output. `no_log` has two consumers:
  # the module registers the values for scrubbing on arrival, and the engine emits `no_log=True` in the
  # generated prof_spec entry (it replaced the unused `sensitive` annotation).
  #
  # `enum OSPF_AUTHENTICATION_KEY_TYPE { validValues=0,3,7; }` maps to the `str` validator like every enum
  # (nvPairs are strings; NDFC returns "3"), so a playbook must write `ospf_authentication_key_type: "3"`.
  # Unquoted `3` is rejected on purpose (no raw-type coercion); the error names the expected type.
  #
  # `string OSPF_AUTH_KEY;` has no default and no length bounds in the template ("in 3DES encrypted form"
  # per NDFC's description), so none are added here; validating the encrypted form belongs to NDFC.


