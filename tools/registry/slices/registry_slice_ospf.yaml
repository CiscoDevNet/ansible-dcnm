  #
  # One slice for three parents: unlike other OSPF fields (passive is an enum on routed/vlan and a boolean
  # on subif; retransmit is absent on routed), the five auth fields are identical in type, default, range
  # and valid values across the three templates (read from the templates, not assumed).
