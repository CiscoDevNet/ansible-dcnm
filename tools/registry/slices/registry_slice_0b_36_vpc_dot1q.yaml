# Registry slice 0b_36 — int_vpc_dot1q_tunnel, the native vPC dot1q-tunnel parent.
#
# Source of truth: the template INSTALLED on the controller (NDFC 12.6.0.267 with SMU), captured
# read-only: int_vpc_dot1q_tunnel.template sha256
# 1eb7a8b6e4f5aba66099aa4c36f56b1491e73ef8f677f57cff8706b0e25c7a94 (990 lines), with children
# int_vpc_dot1q_tunnel_po_11_1 (d33a9e48...) and int_vpc_dot1q_tunnel_po_member_11_1
# (71d5dbf4...). Line numbers refer to that parent capture.
#
# Six rows, same public keys and types as int_vpc_access_host and
# int_port_channel_dot1q_tunnel_host. Each is declared by the parent AND forwarded to the child
# that emits it:
#   aclFilter, spanningTreePortType, qosStatsSuppressed, queuingStats -> each peer's
#     int_vpc_dot1q_tunnel_po_11_1 (port-channel CLI)
#   lldpTransmit, lldpReceive -> each peer's int_vpc_dot1q_tunnel_po_member_11_1 (member CLI)
#
# reset_wire (conditional): each row carries its explicit neutral -- aclFilter '',
# spanningTreePortType 'no', the four booleans 'false'. Same forms as measured on the sibling vPC
# parents, but NOT transferred from them: these values are loaded by the validation replay ONLY
# after a clear stage has sent all six neutrals explicitly on a vPC and the device verdict
# 'cleared' passed on BOTH peers (port-channel and member). If any field fails, the validation stops
# and none is used; a partial registration needs a new, reviewed candidate. default_template is
# unchanged, so omitting a field at its declared default still needs nothing.

- parent_template: int_vpc_dot1q_tunnel
  parent_nvpair: aclFilter
  profile_key: acl_filter
  reset_wire: ''   # conditional on the BOTH-peer clear (see header)
  applicable_interface_type: vpc
  applicable_mode: dot1q
  type: string
  string_compare: exact
  min_length: 1
  max_length: 64
  presence_model: two_axis
  emit_when: explicit_only
  mechanism: passthrough
  no_log: false
  min_ndfc_version: 12.6.0.267
  validated_on: 12.6.0.267
  parent_resolution: desired_parent
  evidence_ref: int_vpc_dot1q_tunnel.template@1eb7a8b6e4f5aba6#L239,L721
  effect_rules:
    - predicate: value_nonempty
      ndfc_effect: child_policy
      child_template: int_vpc_dot1q_tunnel_po_11_1
      cli: "ip port access-group <value> in"
      phase: current

