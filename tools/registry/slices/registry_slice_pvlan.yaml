  # Same public keys, types and reset forms as the sibling host parents (int_access_host,
  # int_port_channel_*_host, int_vpc_*_host, int_vpc_dot1q_tunnel). reset_wire is the explicit neutral
  # of the declared default; on these PVLAN parents it is INFERRED from the siblings and NOT measured
  # live (no non-default value has been sent on a PVLAN parent). No `validated_on`: nothing here has
  # been validated on a controller. default_template is the PVLAN template's own declaration.
  # A PVLAN parent hands lldp to its member and stp/queuingStats/aclFilter to its child; the PVLAN
  # helper (interface_pvlan.py) owns the CLI model of those children and wires these bindings into the
  # PVLAN routes.


