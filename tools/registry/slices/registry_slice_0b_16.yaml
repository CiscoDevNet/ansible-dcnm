- parent_template: int_routed_host
  parent_nvpair: qosStatsSuppressed
  profile_key: disable_qos_stats
  applicable_interface_type: eth
  applicable_mode: routed
  type: boolean
  # G33 F1-s2: medido en vivo, apply+clear en leaf-A Ethernet1/22, 2026-09-23, con
  # ENABLE_QOS=true y QOS_POLICY=port_qos_policy -- una politica que YA existe en el chasis,
  # leida antes de usarla, no inventada. El clear dejo el nvPair en "false" y la linea
  # `service-policy type qos input port_qos_policy` SOBREVIVIO sin el fragmento ` no-stats`,
  # mientras la de queuing conservo el suyo. Confirma en el equipo los dos primeros
  # effect_rules de abajo, que hasta ahora solo estaban declarados.
  reset_wire: "false"
  default_template: false
  presence_model: two_axis
  emit_when: explicit_only
  mechanism: passthrough
  no_log: false
  parent_resolution: desired_parent
  removal_semantics: preserves_on_absent
  min_ndfc_version: "12.6.0.267"
  validated_on: "12.6.0.267"
  evidence_ref: int_routed_host.template#L279
  effect_rules:
    - predicate: value_true_and_qos_policy_resolvable
      ndfc_effect: inline_config
      child_template: interface_qos_service_policy
      cli: "service-policy type qos input <policy> no-stats"
      phase: current
      evidence_ref: int_routed_host.template#L1022
    - predicate: value_false_and_qos_policy_resolvable
      ndfc_effect: inline_config
      child_template: interface_qos_service_policy
      cli: "service-policy type qos input <policy>"
      phase: current
      evidence_ref: int_routed_host.template#L1022
    - predicate: enable_qos_false_or_policy_unresolvable
      ndfc_effect: silent_noop
      phase: current
      evidence_ref: int_routed_host.template#L1017

- parent_template: int_routed_host
  parent_nvpair: queuingStats
  profile_key: disable_queuing_stats
  applicable_interface_type: eth
  applicable_mode: routed
  type: boolean
  # G33 F2-s2: medido en vivo, apply+clear en leaf-A Ethernet1/22, 2026-09-23, con
  # QUEUING_POLICY=port_queuing_policy (existente en el chasis). El clear dejo el nvPair en
  # "false" y la linea `service-policy type queuing output port_queuing_policy` SOBREVIVIO sin
  # ` no-stats`, mientras la de qos conservo el suyo: las dos direcciones son independientes.
  reset_wire: "false"
  default_template: false
  presence_model: two_axis
  emit_when: explicit_only
  mechanism: passthrough
  no_log: false
  parent_resolution: desired_parent
  removal_semantics: preserves_on_absent
  min_ndfc_version: "12.6.0.267"
  validated_on: "12.6.0.267"
  evidence_ref: int_routed_host.template#L287
  effect_rules:
    - predicate: value_true_and_queuing_policy_set
      ndfc_effect: inline_config
      child_template: interface_queuing_service_policy
      cli: "service-policy type queuing output <policy> no-stats"
      phase: current
      evidence_ref: int_routed_host.template#L1032
    - predicate: value_false_and_queuing_policy_set
      ndfc_effect: inline_config
      child_template: interface_queuing_service_policy
      cli: "service-policy type queuing output <policy>"
      phase: current
      evidence_ref: int_routed_host.template#L1032
    - predicate: queuing_policy_empty
      ndfc_effect: silent_noop
      phase: current
      evidence_ref: int_routed_host.template#L1027
