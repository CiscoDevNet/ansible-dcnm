# Format B; designed offline (no engine, no live run). Distinct effect_id: bfd_interval@int_vlan.
# Same shape as int_subif (slice 0b_4); ranges and mandatory-when-gate confirmed against the
# catalog. Mechanism is passthrough for all four rows, for the reason given in slice 0b_4.
shared_effects:
