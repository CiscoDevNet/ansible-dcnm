    # RECHAZA la peticion si queda cualquier opcion activa con el tag vacio, asi que
    # `enable_eigrp_routing` se apago en la MISMA peticion. Eso es una imposicion del
    # producto, no una eleccion, y se registra como tal.
    # READBACK: eigrpProcessTag `EIGRP47` -> `""`. EQUIPO: CERO lineas EIGRP en los
    # cuatro sujetos -- sin inversa y sin residuo, a diferencia de lo observado
    # cuando la interfaz habia llevado `passive`. Rerun identico: 0 mutaciones, y
    # CERO pendientes atribuibles a estos sujetos.
    # LIMITE: un cierre de compuerta agrupado NO valida por separado el retiro de
    # cada subordinada; esas se midieron una por una en rM, rD y los alternos.
    reset_wire: ''
    max_length: 20
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: int_routed_host.template@b9b50077cf49f8cb

