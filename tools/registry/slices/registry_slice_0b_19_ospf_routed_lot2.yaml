  - parent_template: int_routed_host
    parent_nvpair: ospfHelloInterval
    # Depends on OSPF (int_routed_host body 6d37ea6a, not measured): rendered only when ospf is true, and refused with a
    # non-neutral value while ospf is false. An explicit disable sends its reset.
    inert_when:
      nvpair: ospf
      value: 'false'
      strict: true
    profile_key: ospf_hello_interval
    applicable_interface_type: eth
    applicable_mode: routed
    type: integer
    # Measured live (NDFC 12.6.0.267 / NX-OS 10.5(5)). The public integer rejects "" before any
    # request is built, so the wire value was measured with a raw, preserving bulk-modify POST
    # (1 DTO carrying all nvPairs from a fresh readback, only this field set to ""): 207
    # Multi-Status with a single SUCCESS. The readback is the EMPTY STRING ("11" -> ""), not absent,
    # null or a materialized default. On the device `ip ospf hello-interval 11` was removed and
    # `ip router ospf <tag> area 0.0.0.0` survived (OSPF stayed enabled with the same tag and area);
    # all other nvPairs identical, In-Sync. This answers the removal question for this row: although
    # the template never calls deleteChildTemplate for OSPF, clearing the parent nvPair to "" DOES
    # withdraw the child line.
    reset_wire: ""
    min: 1
    max: 65535
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: int_routed_host.template@b9b50077cf49f8cb

