# WP98 — OSPF on int_loopback. The USER loopback, not the fabric one.
#
# WHICH LOOPBACK THIS IS, AND WHY IT MATTERS MORE THAN USUAL
#   The module keeps two loopback parents apart: `"lo_lo": "int_loopback"` and
#   `"lo_fabric": "int_fabric_loopback_11_1"` (dcnm_interface.py:2436-2437). This slice registers
#   the FIRST. Measured on FAB1 on 2026-09-19: all thirteen fabric loopbacks -- loopback0 and
#   loopback1 on every switch, carrying the underlay router-id and the VTEP -- use the fabric
#   parent. ZERO interfaces use int_loopback.
#
#   That distinction is the whole basis of this slice existing. Retired slice 0b_10 registered
#   OSPF authentication on int_fabric_loopback_11_1 and was withdrawn because authentication there
#   is UNDERLAY authentication that fabricSettings owns: the interface value was an override a
#   keychain fabric setting deletes outright. The architect ruled (Q1, 2026-09-19) that the
#   retirement was a decision about OWNERSHIP, not about the word "loopback". A user loopback is
#   not part of the underlay, fabricSettings has no claim on it, and its own template takes
#   authentication from the interface fields. So the five auth rows below are in scope here while
#   the same five stay retired there.
#
# THE TEMPLATE IS INSTALLED -- the note below is CORRECTED IN THIS G41 COPY ONLY
#   G39's copy of this slice says the controller's int_loopback declares none of these fields and
#   that an upload is required first. That was true when it was written and is NOT true now.
#   Measured read-only on 2026-09-24 (G41 entry gate 1c, and identically in the G40 preflight):
#   the INSTALLED body is 50042 bytes, sha256
#   27cd9ce7e671b5f3b3accfe70b5c5e52933450db70bd7e52c67496ec2f870ca7, and it declares all six OSPF
#   integer fields below as `integer` with IsShow="ENABLE_OSPF==true" and the bounds recorded on
#   each row. No template upload was needed or performed.
#   Evidence: <internal evidence record> and
#   ledger/01-entry-gates.json. The G39 slice is left exactly as written; historical slices are
#   not rewritten.
#
#   Preflight done before writing this: the batch body instantiates 37 child templates and all 37
#   are already on the controller, so the upload carries none of the `templateDO is null` risk
#   that blocked int_vlan for two days.
#
# THIS PARENT DIVERGES FROM ALL THREE OVERLAY PARENTS
#   Authored per parent, never copied -- and here is the proof it had to be:
#
#     OSPF_ADVERTISE_SUBNET      boolean. Exists ONLY here. Advertising the loopback's subnet is
#                                a loopback concept; no other parent has the field.
#     OSPF_BFD                   boolean here, exactly as on int_subif. int_routed_host and
#                                int_vlan model the same concept as the enum OSPF_BFD_MODE
#                                (no_change/enable/disable).
#     OSPF_PASSIVE_MODE          ABSENT. The three overlay parents all carry passive control in
#                                some form; this template has none at all.
#     OSPF_RETRANSMIT_INTERVAL   present, as on int_subif and int_vlan, absent on int_routed_host.
#
#   A slice copied from int_routed_host would have registered OSPF_PASSIVE_MODE, which this
#   template does not declare, and missed OSPF_ADVERTISE_SUBNET and OSPF_RETRANSMIT_INTERVAL
#   entirely. The first is the silent failure: the controller drops the key and the run succeeds.
#
# no_log
#   OSPF_AUTH_KEY and OSPF_AUTHENTICATION_KEY carry key material and are marked. The key ID and
#   the encryption-type selector are NOT, for the same reason as every other auth slice: Ansible
#   scrubs by STRING MATCH, so marking an id would replace the bare digits "1" or "3" everywhere
#   in every result, corrupting unrelated output while protecting nothing.
#
# THE REJECTION TURNS ITSELF OFF WHEN THIS LANDS
#   dcnm_interface still refuses the three withdrawn auth keys, but the exemption is granted by
#   the REGISTRY, not by the parent's name: a key passes only where resolve_binding finds a
#   binding for it. Before this slice, int_loopback had none and the keys were refused. With it,
#   they are accepted here and stay refused on the fabric parent -- no second edit, and no window
#   in which the key is neither refused nor carried.

bindings:
  - parent_template: int_loopback
    parent_nvpair: ospf
    profile_key: enable_ospf
    applicable_interface_type: lo
    applicable_mode: lo
    type: boolean
    reset_wire: 'false'
    default_template: false
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: int_loopback.template@264d187d71ee36f9

