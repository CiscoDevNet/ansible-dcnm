# Registry slice 0b_17 — DISABLE_LLDP se parte en dos.
#
# QUE CAMBIA
#   La entrega de engineering del 14sep2026 ELIMINA el campo DISABLE_LLDP de los ocho parents
#   que lo declaraban y lo reemplaza por dos:
#
#     DISABLE_LLDP_TRANSMIT   ->  no lldp transmit
#     DISABLE_LLDP_RECEIVE    ->  no lldp receive
#
#   No es un rename. El campo viejo apagaba las dos direcciones de golpe; los nuevos permiten
#   apagar solo una. Es funcionalidad que antes no existia, por eso son dos bindings y no uno
#   renombrado.
#
#   Los ocho bindings de disable_lldp del slice anterior quedan RETIRADOS: su nvPair ya no
#   existe en ningun template. Registrarlo seguiria pareciendo correcto por API -- un PTI acepta
#   nvPairs que su template no declara -- y no produciria CLI nunca. Ese es justo el modo de
#   fallo que este registry existe para evitar.
#
# EL CODIGO DEL PADRE CAMBIO EN CONSECUENCIA
#   Antes:   if disableLldp == "true":          -> emitia las DOS lineas juntas
#   Ahora:   if disableLldpTransmit == "true":  -> 'no lldp transmit'
#            if disableLldpReceive == "true":   -> 'no lldp receive'
#
#   Leido del template, no supuesto. Las dos condiciones son independientes: poner uno en true y
#   el otro en false debe producir UNA sola linea. Eso es lo que la corrida en vivo tiene que
#   comprobar, y es la prueba que distingue "se partio de verdad" de "se renombro y emite las
#   dos igual".
#
# MECANISMO: passthrough en los dieciseis
#   Mismo razonamiento que ya fijaron los slices 0b_15 y 0b_16. En los parents de port-channel y
#   vPC el valor se delega a un template de miembro; eso no decide el mecanismo. `mechanism` dice
#   quien es dueño de la validacion, del guardia de parent invalido, del prof_spec generico, del
#   carry-forward y de la conversion a forma de cable. Ninguno de los ocho parents tiene
#   maquinaria propia para eso.
#
# LOS TEMPLATES DE MIEMBRO TAMBIEN CAMBIARON
#   int_port_channel_*_member_11_1 e int_vpc_*_po_member_11_1 declaran ahora los dos campos en
#   lugar de DISABLE_LLDP. Importa por la leccion del slice 0b_12: parchear solo el _host deja
#   el nvPair propagandose sin CLI y el switch In-Sync. Los miembros se verificaron actualizados
#   en el controlador antes de registrar esto.
#
# UN DEFECTO DE LA MISMA ENTREGA, YA CORREGIDO EN EL LAB
#   Los diecisiete templates que recibieron este cambio llaman a normalize() sobre los dos
#   valores nuevos, y DIECISIETE no la definen. normalize() ya existia -- treinta y dos templates
#   la traian desde la entrega anterior -- pero no se propago junto con el cambio.
#
#   Efecto medido: NameError al ejecutar el template, config-save 500 con
#   "An unexpected error occurred during template execution", sin nombrar el campo. Se corrigio
#   en el lab agregando las cuatro lineas de la definicion, copiadas verbatim de int_routed_host.
#   Sin ese arreglo estos bindings no se pueden ejercitar.
#
#
# REMOCION: MEDIDA EN VIVO (corrida r1..r4 del 15sep2026)
#   Estos bindings pasan de `unresolved` a `preserves_on_absent`. El valor es nuevo en el
#   vocabulario: antes solo existian "no sabemos" y "omitir borra", y ninguno describia lo que
#   resulto ser cierto. Son DOS comportamientos distintos y conviene no confundirlos:
#
#     r3  el valor cambia a su forma inerte (false / "")  ->  el CLI SE RETIRA del dispositivo
#     r4  el campo se OMITE del payload                   ->  el valor SOBREVIVE intacto
#
#   removal_semantics habla de la segunda. Marcarlos `deletes_on_absent` habria sido FALSO: la
#   omision no borra, preserva -- que es exactamente el contrato que emit_when: explicit_only
#   ya declara, ahora comprobado en el dispositivo y no solo en el diseño.
#
#   Lo de r3 tambien importa y no tiene campo propio: el template no trae rama `else` que borre
#   el hijo, asi que NO estaba dicho si NDFC lo retiraria. Lo hace -- reconcilia y elimina lo
#   que la pasada nueva no crea. Verificado en el switch, no en el controlador.
#
# QUE NO PRUEBA ESTE SLICE
#   evidence_ref apunta a la declaracion en el template: prueba que los campos EXISTEN y donde.
#   La independencia de las dos direcciones, y que cada una emita su linea, lo cierra la corrida
#   r1..r4 -- pendiente al escribir esto.

