  # ==== Source lot dr1_dhcp_relay (3 rows) ====
  # Read from the SMU 4.3.1.0175006017 bodies; not measured live.
  #
  #     int_routed_host      body b5345584...  dhcpServers L151-161, parser L470-484, checks L635-660, child L1278-1285
  #     int_l3_port_channel  body 81c9392e...  dhcpServers L160-170, parser L467-483, checks L636-661, child L1222-1229
  #     int_subif            body 1937c6a5...  dhcpServers L109-119, parser L358-374, checks L480-504, child L849-856
  #     interface_dhcp_relay_internal (child, TEMPLATE_CLI)
  #
  # The three parents declare the same item, "DHCP relay server information (max 16)", IsFabricInstance=true:
  #
  #     ipAddress srvrAddr (IPv4 or IPv6)   string srvrVrf (^[a-zA-Z0-9:_-]*$, 0-32; blank = the interface VRF)
  #
  # The parents read the value with parseDhcpServers: ast.literal_eval of the text, then a list, or the "dhcpServers"
  # key of a wrapper. They refuse more than 16 items and an item without srvrAddr. When the list is not empty they
  # create or update the child interface_dhcp_relay_internal with INTF_NAME, INTF_VRF and the value unchanged; the
  # child renders, per item, `ip dhcp relay address <srvrAddr>` (`ipv6 ...` when the address contains ":"), with
  # `use-vrf <srvrVrf>` when srvrVrf is set and differs, ignoring case, from the interface VRF.
  #
  # No deleteChildTemplate call names that child, unlike the CDP, redirect, PIM BFD and multisite children. A modify
  # first deletes the interface's child policies (int_l3_port_channel unless the hidden SKIP_DEL_ON_ADD is true;
  # int_subif marks them deleted), so an empty list may remove the relay child, but no full clear has been measured.
  # The list contract therefore refuses an explicit empty list over a stored one, and no reset exists (removal_semantics
  # unresolved): an omitted stored list under replaced or overridden is refused. A shorter non-empty list updates the
  # child. On int_l3_port_channel the switch then removes the dropped lines (measured); on int_routed_host and
  # int_subif this is not measured. int_routed_host deletes every
  # interface-scoped child when its policy is replaced (POLICY_CHANGE_DROPS_CHILDREN in the generator).
  #
  # The meaning of IsFabricInstance=true for an interface field was not established. This list does not replace the
  # numbered DHCP server fields of int_vlan.

