  # Simplest case in the registry: one field, one child, one line (`ip arp timeout $$ARP_TIMEOUT$$`),
  # no boolean gate, no cross-field dependency.
  #
  # Not native: `arp_timeout` and `ARP_TIMEOUT` have 0 uses in dcnm_interface.py.
