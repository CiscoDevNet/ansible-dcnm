  # Registration: the generator silently skips any row not in COMMITTED_BINDINGS. Audit of all
  # slices: the rows still unregistered are intentional — int_fabric_loopback_11_1
  # ENABLE_OSPF_AUTH_MESSAGE_DIGEST (capability retired; a test asserts it is not registered) and
  # DISABLE_LLDP on eight parents (nvPair absent from current bodies, replaced by the registered
  # DISABLE_LLDP_TRANSMIT/RECEIVE).
  #
  # mechanism: passthrough (not child_pti). The module writes ARP_TIMEOUT into the PARENT nvPairs;
  # the parent DSL instantiates `interface_ip_arp_timeout_11_1`. The module does not build the
  # child (same reasoning as BFD and dampening). effect_rules describe the template's effect, which
  # is still accurate, not the module's mechanism.
  #
  # Range min 60 / max 28800: taken from the declaration, which changed. The earlier body had an
  # unbounded `integer ARP_TIMEOUT;` (so the old `min: 1` mirrored the DSL check); the current body
  # has `integer ARP_TIMEOUT { min = 60; max = 28800; }`. Measured by comparing bodies: ARP_TIMEOUT
  # is the only pre-existing declaration that changed (other 53 of 54 identical), so no other row
  # is affected. This is why evidence_ref carries the body hash.
  #   Limits now live in three layers with two thresholds:
  #     parent declaration  min=60 max=28800
  #     child declaration   min=60 max=28800
  #     DSL block           only `int(arpTimeout) <= 0` -> "ARP timeout must be a positive integer."
  #   The registry follows the declaration (the published input contract). Consequence: the DSL
  #   rule is unreachable from the module; record it as a skipped stage with reason, not PASS.
  #   NOT MEASURED: whether the NDFC POST enforces 60..28800 or only the GUI does. If not, the
  #   registry is the only defense (check: send 30 via the module, must reject, and via the API).
  #
  # Measured against the bodies the controller runs, downloaded before reading any attribute:
  #     int_routed_host.template@65426107b3d1cdcf
  #     int_subif.template@a66388c2f21c5507
  #     int_vlan.template@0efb09af7f837b30
