    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    evidence_ref: int_trunk_host.template#L201
    catalog_ref: WP98_TEMPLATE_PARAMETER_CATALOG.csv#int_trunk_host/DISABLE_QOS_STATS
