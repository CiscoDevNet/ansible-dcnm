# Phase 0B — slice 6: Dampening on int_routed_host (conditional-composition canary).
# Offline, design-only. No engine, no live. Format B, one shared effect + conditional_requirements.
# UNLIKE BFD: gate=true with no values is valid (required_when_gate: []). The finer rules
# (verified in child interface_dampening.template#L55-67 + IsShow/IsMandatory) are expressed
# as conditional_requirements. Ranges from catalog. removal_semantics: unresolved.
shared_effects:
  - effect_id: dampening@int_routed_host
    parent_template: int_routed_host
    child_template: interface_dampening
    gate_nvpair: ENABLE_DAMPENING
    predicate: gate_true
    ndfc_effect: create_or_update
    relationship: base
    phase: current
    removal_semantics: unresolved
    required_when_gate: []          # none unconditionally required (ENABLE alone is valid)
    value_bindings:
      - {source_parent_nvpair: dampeningHalfLife,     target_child_nvpair: DAMPENING_HALF_LIFE,     transform: identity}
      - {source_parent_nvpair: dampeningReuse,         target_child_nvpair: DAMPENING_REUSE,         transform: identity}
      - {source_parent_nvpair: dampeningSuppress,      target_child_nvpair: DAMPENING_SUPPRESS,      transform: identity}
      - {source_parent_nvpair: dampeningMaxSuppress,  target_child_nvpair: DAMPENING_MAX_SUPPRESS,  transform: identity}
      - {source_parent_nvpair: dampeningRestart,       target_child_nvpair: DAMPENING_RESTART,       transform: identity}
      - {source_parent_nvpair: dampeningRestartPenalty, target_child_nvpair: DAMPENING_RESTART_PENALTY, transform: identity}
    conditional_eval: explicit_intent   # conditions evaluate over EXPLICIT intent, before defaults/HAVE
    conditional_requirements:
      # 6: any explicit dampening value requires the gate (avoids silent no-op)
      - kind: requires_gate
        params: [DAMPENING_HALF_LIFE, DAMPENING_REUSE, DAMPENING_SUPPRESS, DAMPENING_MAX_SUPPRESS, DAMPENING_RESTART, DAMPENING_RESTART_PENALTY]
        evidence_ref: "int_routed_host.template@b9b50077cf49f8cb#L790"
      # 3a: reuse/suppress/max_suppress are all-or-none
      - kind: all_or_none
        params: [DAMPENING_REUSE, DAMPENING_SUPPRESS, DAMPENING_MAX_SUPPRESS]
        evidence_ref: "interface_dampening.template#L28"
      # 3b: that group requires half_life
      - kind: requires
        if_present: [DAMPENING_REUSE]
        then_required: [DAMPENING_HALF_LIFE]
        evidence_ref: "interface_dampening.template#L22"
      # 4: restart=true requires the full group + half_life
      - kind: if_true_requires
        if_true: DAMPENING_RESTART
        then_required: [DAMPENING_HALF_LIFE, DAMPENING_REUSE, DAMPENING_SUPPRESS, DAMPENING_MAX_SUPPRESS]
        evidence_ref: "interface_dampening.template#L55"
      # 5: restart_penalty requires restart=true
      - kind: requires_true
        if_present: [DAMPENING_RESTART_PENALTY]
        then_true: DAMPENING_RESTART
        evidence_ref: "interface_dampening.template#L45"
    evidence_ref: "int_routed_host.template@b9b50077cf49f8cb#L794"

