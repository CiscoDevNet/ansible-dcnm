# -------------------------------------------------------------------------------------
# Mechanism for all seven rows: passthrough (not child_pti)
# -------------------------------------------------------------------------------------
# The module writes the values into the PARENT's nvPairs; the int_routed_host DSL instantiates
# `interface_dampening` from them (installed body :1186-1196). The module does not build the
# child. Same reasoning as the BFD rows (slices 0b_4/0b_5), which were confirmed live by measuring
# the device line. Note: the generator silently skips any row not listed in COMMITTED_BINDINGS.
#
# That live confirmation is NOT possible here: the `dampening` CLI does not exist on either lab
# image. Probed through NDFC with the command the child produces, `dampening 10 1500 3000 60`:
#     nxos64-cs-lite.10.5.5.M  -> CLI command is invalid
#     nxos64-cs.10.6.2.F       -> CLI command is invalid
# The full image rejects it too, so the cause is not the lite image: the command is absent from
# the C9300v NX-OS.
#
# Validation scope: device layer IMPOSSIBLE (no value of these seven produces a line here).
# Controller layer possible: the POST evaluates the template before deploy, so the four dependency
# rules are exercised and the read-back can be read.
#
# Dependency chain (four levels, the deepest in the registry):
#     ENABLE_DAMPENING                 boolean, defaultValue=false
#       DAMPENING_HALF_LIFE            1..30      IsShow ENABLE==true
#         DAMPENING_REUSE              1..20000   IsShow ENABLE && HALF_LIFE!=''
#         DAMPENING_SUPPRESS           1..20000   same
#         DAMPENING_MAX_SUPPRESS       1..255     same
#         DAMPENING_RESTART            boolean    IsShow ENABLE && REUSE!=''
#           DAMPENING_RESTART_PENALTY  1..20000   IsShow ENABLE && RESTART==true
#
# Four template rules, enforced by NDFC on POST (none are ours):
#     "Dampening half-life is required when reuse, suppress, or max suppress is configured."
#     "Dampening reuse, suppress, and max suppress must be configured together."
#     "Dampening restart can only be configured with half-life, reuse, suppress, and max
#      suppress values."
#     "Dampening restart penalty requires dampening restart to be enabled."
# The second ties THREE registered fields together (the first such rule in the registry).
#
# Six fields render one line, in five variants (installed child interface_dampening):
#     dampening $HALF_LIFE $REUSE $SUPPRESS $MAX_SUPPRESS restart $RESTART_PENALTY
#     dampening $HALF_LIFE $REUSE $SUPPRESS $MAX_SUPPRESS restart
#     dampening $HALF_LIFE $REUSE $SUPPRESS $MAX_SUPPRESS
#     dampening $HALF_LIFE
#     dampening
# Even on hardware that supports it, counting lines would prove nothing.
#
# Only int_routed_host declares dampening; int_subif, int_vlan and int_loopback declare none of the 7.
