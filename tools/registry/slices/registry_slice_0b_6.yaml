# =====================================================================================
# CORRECCION 2026-09-20 — el mecanismo de las siete filas de dampening: child_pti -> passthrough
# =====================================================================================
#
# Estas siete llevaban escritas desde este slice y NUNCA llegaron a la tabla: no estaban en
# COMMITTED_BINDINGS, y el generador salta en silencio una fila que no este en esa lista. Es
# exactamente lo que habia pasado con las ocho de BFD.
#
# POR QUE passthrough Y NO child_pti
#   El modulo escribe los valores en los nvPairs del PADRE y es el DSL de int_routed_host el que
#   instancia `interface_dampening` con ellos (:1186-1196 del cuerpo instalado). El modulo no
#   construye el hijo. Ese es el mismo razonamiento por el que las ocho de BFD se corrigieron, y
#   ahi la ronda en vivo lo confirmo midiendo la linea en el equipo.
#
#   Aqui esa confirmacion NO se puede hacer, y conviene decirlo en vez de dejarlo implicito:
#   `dampening` no existe en el NX-OS de estos switches.
#
# EL CLI NO EXISTE EN NINGUNA DE LAS DOS IMAGENES DEL LAB
#   Sondeado por NDFC con el comando que el hijo produce:
#
#     FAB1  nxos64-cs-lite.10.5.5.M   `dampening 10 1500 3000 60` -> CLI command is invalid
#     FAB4  nxos64-cs.10.6.2.F        `dampening 10 1500 3000 60` -> CLI command is invalid
#
#   La fase 33 lo midio en FAB1 y lo atribuyo a la imagen lite. FAB4 corre la COMPLETA -- la que
#   si soporta EIGRP, que la lite no -- y tambien lo rechaza. La causa no es "lite": el comando
#   no esta en el NX-OS de C9300v. Eso corrige el hallazgo anterior.
#
# ALCANCE DE LO QUE SE PUEDE VALIDAR
#   Capa de dispositivo: IMPOSIBLE. Ningun valor de estos siete producira una linea aqui.
#   Capa de controlador: SI. El POST evalua el template antes del deploy, asi que las cuatro
#   reglas de dependencia se ejercitan y el read-back se lee.
#
# CUATRO NIVELES DE DEPENDENCIA -- la cadena mas profunda del registro
#       ENABLE_DAMPENING                 boolean, defaultValue=false
#         DAMPENING_HALF_LIFE            1..30      IsShow ENABLE==true
#           DAMPENING_REUSE              1..20000   IsShow ENABLE && HALF_LIFE!=''
#           DAMPENING_SUPPRESS           1..20000   idem
#           DAMPENING_MAX_SUPPRESS       1..255     idem
#           DAMPENING_RESTART            boolean    IsShow ENABLE && REUSE!=''
#             DAMPENING_RESTART_PENALTY  1..20000   IsShow ENABLE && RESTART==true
#
# CUATRO REGLAS DEL TEMPLATE, NINGUNA NUESTRA
#       "Dampening half-life is required when reuse, suppress, or max suppress is configured."
#       "Dampening reuse, suppress, and max suppress must be configured together."
#       "Dampening restart can only be configured with half-life, reuse, suppress, and max
#        suppress values."
#       "Dampening restart penalty requires dampening restart to be enabled."
#
#   La segunda liga TRES campos registrados entre si -- la primera de ese tipo en el registro;
#   HSRP tenia pares. NDFC las impone en el POST, que es justo lo que las hace medibles aqui.
#
# SEIS CAMPOS EN UNA SOLA LINEA, CON CINCO VARIANTES
#   Del hijo interface_dampening, instalado:
#       dampening $HALF_LIFE $REUSE $SUPPRESS $MAX_SUPPRESS restart $RESTART_PENALTY
#       dampening $HALF_LIFE $REUSE $SUPPRESS $MAX_SUPPRESS restart
#       dampening $HALF_LIFE $REUSE $SUPPRESS $MAX_SUPPRESS
#       dampening $HALF_LIFE
#       dampening
#   BFD fundia tres campos en una linea y HSRP dos mas un nativo; aqui son seis y la forma de la
#   linea cambia segun cuales esten puestos. Si algun dia corre en hardware que lo soporte,
#   contar lineas no probara nada.
#
#   SOLO int_routed_host declara dampening: int_subif, int_vlan e int_loopback, 0 de 7.
