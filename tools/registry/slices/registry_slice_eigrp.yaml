    parent_nvpair: eigrpProcessTag
    profile_key: eigrp_process_tag
    applicable_interface_type: eth
    applicable_mode: routed
    type: string
    string_compare: unverified
    # Measured live on four lab interfaces that never carried a `passive` option.
    # Coordinated transition, not an independent removal: the parent's first validator
    # rejects the request if any option stays enabled with an empty tag, so
    # `enable_eigrp_routing` was cleared in the same request (a product constraint).
    # Readback: eigrpProcessTag `<tag>` -> `""`. Device: zero EIGRP lines, no inverse
    # command and no residue (unlike interfaces that had carried `passive`). Identical
    # rerun: 0 mutations, no pending config on these interfaces.
    # LIMIT: a grouped gate close does not validate each subordinate field's removal;
    # those were measured one by one (see the per-field notes).
    reset_wire: ''
    max_length: 20
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: int_routed_host.template@b9b50077cf49f8cb

