# Registry source: EIGRP on the routed, subinterface, SVI and loopback parents.
#
# Compiled by tools/gie_generate_binding_table.py with the other registry_slice_*.yaml files; see
# tools/registry/README.md. Each section below is one original source lot. Its header is the original
# text. A lot whose rows span several families keeps its header in the family that holds most of them
# and is cross-referenced from the others.

shared_effects: []

bindings:

  # ==== Source lot registry_slice_0b_22_eigrp.yaml (39 of 39 rows) ====
  # Registry slice 0b_22 — the thirteen EIGRP fields on the three overlay parents
  # (int_routed_host, int_subif, int_vlan).
  #
  # One slice for three parents because the thirteen fields are identical across them (type,
  # default, bounds, valid values). Measured against the template bodies running on the
  # controller, not assumed from the on-disk template batch. Uniformity is checked per family,
  # never assumed: the OSPF scalars needed one slice per parent (passive/bfd are enums on routed
  # and vlan but booleans on subif; retransmit_interval does not exist on routed).
  #
  # Source: template bodies fetched from the controller. Three of the
  # four parents on the controller differ from the local template batch, and the installed
  # int_loopback has no EIGRP at all; a slice authored from the batch would describe templates
  # nobody runs. evidence_ref pins the controller body.
  #
  # Gate: EIGRP_PROCESS_TAG. The parent DSL wraps the whole EIGRP block in
  # `if eigrpProcessTag != "":`; the tag has no default and all eleven booleans default to false
  # with IsShow="EIGRP_PROCESS_TAG!=''". Nothing fires by default (unlike int_vlan's
  # DISABLE_IP_REDIRECTS, which defaults to true and instantiates a child), so this family needed
  # no template upload.
  #
  # The template itself rejects the tagless case. All three parents (and the new int_loopback)
  # carry, above the creation block:
  #
  #       if eigrpOptionSelected and eigrpProcessTag == "":
  #           errMsg = "EIGRP process tag is required when EIGRP interface options are enabled."
  #           respObj.setFailureRetCode()
  #           return respObj
  #
  #   (int_routed_host:897, int_subif:679, int_vlan:939 in the captured controller bodies.)
  #
  # Read from the bodies. A former claim that NDFC accepts a tagless config, instantiates nothing
  # and reports success was an unmeasured inference and is contradicted by these bodies.
  #
  # These rows therefore do not enforce the gate: NDFC implements it. The engine validates
  # membership and transports the string. The module must not demand the tag in every profile: a
  # valid partial update may omit it while HAVE carries it, and the comparator preserves it.
  #
  # Two more template-enforced rules (all three parents; not duplicated here):
  #
  #       "EIGRP IPv4 passive-interface enable and disable cannot both be selected."
  #       "EIGRP BFD enable and disable cannot both be selected."
  #
  #   i.e. (eigrp_ipv4_passive, eigrp_no_ipv4_passive) and (enable_eigrp_bfd, disable_eigrp_bfd)
  #   are mutually exclusive. Carry-forward can trip them without the operator sending both: send
  #   disable_eigrp_bfd while HAVE holds enable_eigrp_bfd and the preserved value arrives beside
  #   the new one. That interaction needs a live check; it is not assumed.
  #
  # Template asymmetry, not a typo: IPv4 has EIGRP_IPV4_PASSIVE and EIGRP_NO_IPV4_PASSIVE; IPv6
  # has only EIGRP_NO_IPV6_PASSIVE. Children match: eigrp_interface_ip_passive_11_1,
  # eigrp_interface_no_ip_passive_11_1 and eigrp_interface_no_ipv6_passive_11_1 exist; no
  # ipv6-passive child exists.
  #
  # The distribute-list directions are enums gated by their prefix list, not by the tag:
  # EIGRP_IPV4_DISTRIBUTE_LIST_DIRECTION is IsShow-gated on EIGRP_IPV4_DISTRIBUTE_LIST_PREFIX_LIST
  # being non-empty. Valid values are quoted: enums map to the `str` validator because nvPairs
  # are string-valued and NDFC returns "out".
  #
  # All ten children are installed: verified against the controller by reading the parents' DSL
  # (not by name search); zero absent children on the three parents.


