  # WHY EIGHT: measured against the body the controller runs, int_loopback.template@27cd9ce7e671b5f3
  #   (local copy verified byte-identical, 50042 bytes). It declares eight of the family's thirteen
  #   fields and does NOT declare:
  #       ENABLE_EIGRP_IPV6_ROUTING
  #       EIGRP_IPV4_DISTRIBUTE_LIST_PREFIX_LIST   EIGRP_IPV4_DISTRIBUTE_LIST_DIRECTION
  #       EIGRP_IPV6_DISTRIBUTE_LIST_PREFIX_LIST   EIGRP_IPV6_DISTRIBUTE_LIST_DIRECTION
  #   Registering those would be a silent drop (NDFC discards an undeclared nvPair, the module
  #   reports success, the device gets nothing). Slice 0b_22's uniformity across the overlay parents
  #   is NOT evidence for this parent, and here it does not hold. This parent previously had no
  #   EIGRP; the running body declares all eight as a side effect of the upload done for the OSPF
  #   fields (measured, not assumed).
  #
  # GATE AND REFUSALS (as slice 0b_22): `EIGRP_PROCESS_TAG` has no default; all seven booleans are
  #   IsShow-gated on `EIGRP_PROCESS_TAG!=''`, and the DSL wraps creation in
  #   `if eigrpProcessTag != "":` (:841). The three template-enforced refusals (installed body):
  #       :440  if eigrpOptionSelected and eigrpProcessTag == "":      tagless option
  #       :447  if eigrpNoIpv4Passive and eigrpIpv4Passive:            the passive pair
  #       :454  if enableEigrpBfd and disableEigrpBfd:                 the BFD pair
  #   Not duplicated here: NDFC enforces them and fails loudly. The engine validates membership and
  #   transports the string.
  #
  # ALL SEVEN CHILDREN INSTALLED (read from the parent DSL, not matched by name); each CLI was
  #   measured on hardware through NDFC on a loopback (nxos64-cs.10.6.2.F.bin):
