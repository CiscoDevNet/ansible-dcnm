  # ==== Source lot registry_slice_0b_24_bfd.yaml (1 of 1 rows) ====
  # Registry slice 0b_24 — interface BFD. ONE new binding, not nine.
  #
  # The other eight BFD rows live in registry_slice_0b_4.yaml (int_subif) and
  #   registry_slice_0b_5.yaml (int_vlan); registering them here again fails the generator with
  #   `ValueError: duplicate committed binding ('int_subif', 'ENABLE_BFD_INTERVAL')`. Rows whose
  #   (parent, nvpair) is not in the generator's COMMITTED_BINDINGS allowlist are SKIPPED silently,
  #   by design, which is why those eight showed as pending. Their type, minimum and maximum were
  #   checked against the bodies the controller runs (eight for eight) before allowlisting.
  #
  # New here: int_vlan DISABLE_BFD_ECHO. The public key `disable_bfd_echo` already exists on
  #   int_routed_host, so this adds a (parent, nvpair) pair, not a new public field. It has its own
  #   child and line, `no bfd echo`.
  #
  # THREE FIELDS, ONE LINE (unique in this registry): the interval child renders all three values
  #   into a single line, so transport is proven by reading the three VALUES, not by "one line
  #   changed":
  #       interface_bfd_interval_11_1  ->  bfd interval $TX min_rx $MIN_RX multiplier $MULT
  #
  # THE TEMPLATE ENFORCES THE GATE, SO NOTHING HERE DOES (int_subif:650, int_vlan:1119, installed
  #   bodies):
  #       "BFD TX interval, minimum RX interval, and multiplier are required when interface BFD
  #        interval is enabled."
  #   The three intervals also carry IsShow="ENABLE_BFD_INTERVAL==true". Same decision as EIGRP's
  #   process tag: a module rule requiring all three in every profile would break a valid partial
  #   update whose other two values come from HAVE.


  - parent_template: int_vlan
    parent_nvpair: bfdEcho
    profile_key: disable_bfd_echo
    applicable_interface_type: svi
    applicable_mode: vlan
    type: boolean
    reset_wire: 'false'
    default_template: false
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: int_vlan.template@0efb09af7f837b30

  # ==== Source lot registry_slice_0b_31_pim.yaml (8 of 8 rows) ====
  # NOTE (SMU 4.3.1.0175006017, read from the installed bodies, not exercised live): int_routed_host now calls deleteChildTemplate on
  # pim_bfd_instance_interface when pimBfdInstance is false, which the 'no deleteChildTemplate for PIM' remark below did not have. The
  # removal path of enable_pim_bfd_instance=false therefore needs revalidation; the new branch is not a confirmed fix. int_subif and
  # int_l3_port_channel declare pimBfdInstance too and are not registered here.
  #
  # Registry slice 0b_31 — PIM. Eight bindings: three fields spread unevenly over four parents.
  #
  #     ENABLE_PIM_SPARSE        4   int_loopback, int_routed_host, int_subif, int_vlan
  #     PIM_DR_PRIORITY          3   int_routed_host, int_subif, int_vlan
  #     ENABLE_PIM_BFD_INSTANCE  1   int_routed_host
  #
  #   PIM_DR_PRIORITY is absent from int_loopback by design (a loopback takes no part in DR
  #   election); verified that the int_loopback body does not declare it.
  #
  # Sources: the bodies the controller runs, downloaded before any attribute was read:
  #     int_loopback.template@27cd9ce7e671b5f3
  #     int_routed_host.template@65426107b3d1cdcf
  #     int_subif.template@a66388c2f21c5507
  #     int_vlan.template@0efb09af7f837b30
  #     pim_interface.template@27d7ff34de4b9047                (child of sparse)
  #     interface_pim_dr_priority.template@83247cad0c81163f    (child of dr-priority)
  #     pim_bfd_instance_interface.template@463bffbfe4eaa10f    (child of bfd-instance)
  #   All three children are INSTALLED; their content was read, not assumed:
  #       pim_interface                 ->  ip pim sparse-mode
  #       interface_pim_dr_priority     ->  ip pim dr-priority $$PIM_DR_PRIORITY$$
  #       pim_bfd_instance_interface    ->  ip pim bfd-instance
  #   One line per field (unlike BFD, HSRP, dampening), so "exactly one line changed" is meaningful.
  #
  # TRAP: VALUE 1 EMITS NO LINE, AND 1 IS THE RANGE MINIMUM. All three declaring parents gate on
  #       if pimDrPriority != "" and pimDrPriority != "1":
  #           createOrUpdate(... "interface_pim_dr_priority" ...)
  #   and the read's `except` defaults to "1" (int_routed_host:563, int_subif:411, int_vlan:857).
  #   With `min = 1`, the lower bound is also the silent value and the defaultValue. A lower-bound
  #   test sees no line: expected DSL behavior, not a defect. Validation separates "send 1, expect
  #   no line" from "send 0, expect the engine to reject it on the bound".
  #
  # PIM_DR_PRIORITY IS `long` IN THE TEMPLATE AND REGISTERED AS `integer`:
  #       long PIM_DR_PRIORITY { min = 1; max = 4294967295; defaultValue = 1; }
  #   The registry `type` is a key of _TYPE_TO_VALIDATOR (boolean/enum/string/integer), not the
  #   literal template type; `long` would make gie_validator_type raise GieBindingError (fail
  #   closed, binding unreachable). `integer` validates identically (Python 3 int is unbounded;
  #   4294967295 fits), so no engine alias was added. First registry field whose declared type is
  #   not in the engine map; deliberate.
  #
  # THE THREE FIELDS ARE INDEPENDENT: no IsShow and no addErrorReport relating them in any of the
  #   four parents. The gates are standalone `if`s:
  #       if enablePimSparse == "true":                          (int_routed_host:1246)
  #       if pimDrPriority != "" and pimDrPriority != "1":        (int_routed_host:1253)
  #       if enablePimBfdInstance == "true":                      (int_routed_host:1260)
  #   No template negatives; negative tests target the REGISTRY bounds (as for ARP_TIMEOUT).
  #   ENABLE_PIM_SPARSE is NOT a DSL precondition of PIM_DR_PRIORITY: the template can emit
  #   `dr-priority` without `sparse-mode`. Whether NX-OS refuses that is an open device question
  #   the template does not answer.
  #
  # NO deleteChildTemplate FOR PIM IN ANY PARENT. As for ARP_TIMEOUT, this does NOT predict residue
  #   after `deleted` (deleting the interface removes the policy and its children). Not yet
  #   measured: keeping the interface managed with the boolean OFF (the case that left residue for
  #   EIGRP); enable_pim_sparse: false does not instantiate the child, but does not request removal
  #   of an existing one either. Hence removal_semantics: unresolved on all eight.
  #
  # NOT NATIVE MODULE ARGS: the three public keys and three nvPairs have 0 matches in
  #   dcnm_interface.py.
  #
  # DEVICE SUPPORT: the operator confirms PIM and PIM6 are supported; `show feature` lists them as
  #   `disabled`, so `feature pim` must be enabled by an NDFC policy (as for eigrp, bfd, hsrp). Not
  #   taken as measured: if the CLI turns out not to exist, that is documented as a limit without
  #   retiring the registration.
  #
  # MECHANISM: passthrough on all eight. The module writes the PARENT nvPairs; the DSL instantiates
  #   the three children (same reasoning as BFD, dampening and ARP_TIMEOUT).


  # ======================================================= ENABLE_PIM_SPARSE, all four parents
  - parent_template: int_loopback
