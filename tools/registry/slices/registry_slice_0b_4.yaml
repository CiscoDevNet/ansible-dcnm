# Phase 0B — slice 4: BFD Interval on int_subif (composition canary, shared effect).
# Offline, design-only. No engine, no live. Format B: {shared_effects, bindings}.
# 4 params (1 gate + 3 value_source) -> ONE child interface_bfd_interval_11_1, ONE shared effect.
# The 3 values are mandatory when the gate is true (catalog: mand=ENABLE_BFD_INTERVAL==true).
# Ranges from catalog. No delete yet -> removal_semantics: unresolved.
shared_effects:
  - effect_id: bfd_interval@int_subif
    parent_template: int_subif
    child_template: interface_bfd_interval_11_1
    gate_nvpair: ENABLE_BFD_INTERVAL
    predicate: gate_true
    ndfc_effect: create_or_update
    relationship: base
    phase: current
    removal_semantics: unresolved
    required_when_gate: [BFD_TX_INTERVAL, BFD_MIN_RX_INTERVAL, BFD_MULTIPLIER]
    value_bindings:
      - {source_parent_nvpair: bfdTxInterval,     target_child_nvpair: BFD_TX_INTERVAL,     transform: identity}
      - {source_parent_nvpair: bfdMinRxInterval, target_child_nvpair: BFD_MIN_RX_INTERVAL, transform: identity}
      - {source_parent_nvpair: bfdMultiplier,      target_child_nvpair: BFD_MULTIPLIER,      transform: identity}
    evidence_ref: "int_subif.template#L559"

bindings:
  - parent_template: int_subif
    parent_nvpair: bfdInterval
    profile_key: enable_bfd_interval
    applicable_interface_type: sub_int
    applicable_mode: subint
    type: boolean
    reset_wire: 'false'
    default_template: false
    presence_model: two_axis
    emit_when: explicit_only
    # passthrough, corrected 2026-09-19. This row said child_pti, inherited from the phase0
    # ledger's prediction, and was never committed so nobody had to reconcile it. The module
    # writes this value into the PARENT's nvPairs and NDFC's own DSL instantiates
    # interface_bfd_interval_11_1 from it -- the module never touches the child. That is exactly
    # how every OSPF field works: `ip ospf cost` is rendered by ospf_interface_cost_11_1 and its
    # binding is passthrough. The ledger over-predicted child_pti and it is measured: of the ten
    # nvPairs it labelled that way, three were.
    mechanism: passthrough
    no_log: false
    min_ndfc_version: "12.6.0.267"
    validated_on: "12.6.0.267"
    parent_resolution: desired_parent
    effect_id: bfd_interval@int_subif
    effect_role: gate
    evidence_ref: "int_subif.template#L555"

