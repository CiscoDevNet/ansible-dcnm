    # SUCCESS, deploy 200. MEASURED readback 'false' ("true" -> "false"), not a default predicted
    # by the proposal. `no ip redirects` disappeared; absent address, mtu and other nvPairs held.
    # Global DISABLE_IP_REDIRECTS stayed 'false' and the OTHER split field 'true' throughout:
    # only this row's line disappeared and the companion's SURVIVED. Reapplying restored the
