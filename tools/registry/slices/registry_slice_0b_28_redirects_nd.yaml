    # Update 207 con un unico SUCCESS para <lab-serial>~vlan3784; deploy 200.
    # READBACK MEDIDO = STRING 'false' ("true" -> "false"), no predeterminado por la propuesta.
    # Desaparecio `no ip redirects`; sobrevivieron direccion-ausente, mtu y el resto de nvPairs.
