# Registry slice 0b_20 — OSPF on int_subif (first bindings for this parent).
#
# Extracted from this template, not copied from int_routed_host. The three OSPF parents model the
# same concepts differently (hence the (parent_template, parent_nvpair) key):
#
#       concept      int_routed_host        int_subif                int_vlan
#       passive      OSPF_PASSIVE_MODE      OSPF_PASSIVE_INTERFACE   OSPF_PASSIVE_MODE
#                    enum                   BOOLEAN                  enum
#       bfd          OSPF_BFD_MODE          OSPF_BFD                 OSPF_BFD_MODE
#                    enum                   BOOLEAN                  enum
#       retransmit   absent                 OSPF_RETRANSMIT_INTERVAL OSPF_RETRANSMIT_INTERVAL
#
# Every type, default, range and length is read from the installed template (sha a66388c2f21c5507),
# never inferred from a sibling parent.
#
# applicable_interface_type / applicable_mode are DESCRIPTIVE (resolve_binding matches on
# parent_template alone) but use the module's vocabulary
# (`pol_ind_str = delem["type"] + "_" + profile["mode"]` selects the policy).
#
# Module wiring: two calls added to dcnm_interface.py for this parent, mirroring the eth path:
# gie_extend_prof_spec in its validator and gie_contribute_nvpairs in its builder. No
# feature-specific key added.
#
# Excluded: ENABLE_OSPF_AUTH, OSPF_AUTH_KEY, OSPF_AUTHENTICATION_KEY, OSPF_AUTH_KEY_ID and
# OSPF_AUTHENTICATION_KEY_TYPE carry or gate secrets; handled in a separate slice for all parents.
#
# mechanism: passthrough throughout; none owns a dedicated validation path
# (test_gie_mechanism_contract.py fails if a child_pti binding lacks a guarding implementation).
#
# removal_semantics: unresolved, as on int_routed_host: the template creates a child per field and
# never deletes one. Withdrawal is contract A, pending confirmation.
#
# Integer reset (rows marked "MEASURED LIVE" below): measured on int_subif Ethernet1/21.3001
# (encapsulation dot1q 3001, no IP), NDFC 12.6.0.267 / NX-OS 10.5(5). The public integer rejects ""
# before building a request, so the wire value was measured with a raw preserving bulk-modify POST.
# The DTO was derived from THIS parent (56 nvPairs, envelope with `skipResourceCheck`, which
# int_routed_host lacks): 207 Multi-Status, single SUCCESS. Readback EMPTY STRING (not absent, null
# or a materialized default). The field's line disappeared while `ip router ospf <tag> area 0.0.0.0`
# and `encapsulation dot1q 3001` SURVIVED (OSPF still enabled, same tag and area); other nvPairs
# identical, In-Sync. Answers the removal question for that row on THIS parent.

bindings:
  - parent_template: int_subif
    parent_nvpair: ospf
    profile_key: enable_ospf
    applicable_interface_type: sub_int
    applicable_mode: subint
    type: boolean
    reset_wire: 'false'
    default_template: false
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: int_subif.template@a66388c2f21c5507

