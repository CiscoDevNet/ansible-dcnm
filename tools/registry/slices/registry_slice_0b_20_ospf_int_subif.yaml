  - parent_template: int_subif
    parent_nvpair: ospfBfdMode
    # SMU 4.3.1.0175006017 replaced the boolean ospfBfd with this enum (int_subif body 1937c6a5, read, not exercised
    # live). The public boolean ospf_bfd stays accepted as an input alias (true -> enable, false -> no_change) and is
    # translated before validation; see gie_normalize_ospf_aliases.
    # Depends on OSPF: rendered only when ospf is true, and refused with a non-neutral value while ospf is false.
    # An explicit disable sends its reset.
    inert_when:
      nvpair: ospf
      value: 'false'
      strict: true
    wire_values: {no_change: noChange, enable: enable, disable: disable}   # SMU enum vocabulary; public valid_values unchanged
    profile_key: ospf_bfd_mode
    applicable_interface_type: sub_int
    applicable_mode: subint
    type: enum
    reset_wire: 'noChange'
    valid_values: [no_change, enable, disable]
    default_template: no_change
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: int_subif.template@1937c6a5f49d0d48

