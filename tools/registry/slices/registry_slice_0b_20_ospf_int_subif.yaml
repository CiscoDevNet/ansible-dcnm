# WP98 — OSPF on int_subif. First bindings ever registered for this parent.
#
# EXTRACTED FROM THIS TEMPLATE, NOT COPIED FROM int_routed_host.
#   The three OSPF parents model the same concepts DIFFERENTLY, which is why the table is keyed
#   by (parent_template, parent_nvpair) and why copying a slice would have registered nvPairs
#   that do not exist here:
#
#       concept      int_routed_host        int_subif                int_vlan
#       passive      OSPF_PASSIVE_MODE      OSPF_PASSIVE_INTERFACE   OSPF_PASSIVE_MODE
#                    enum                   BOOLEAN                  enum
#       bfd          OSPF_BFD_MODE          OSPF_BFD                 OSPF_BFD_MODE
#                    enum                   BOOLEAN                  enum
#       retransmit   absent                 OSPF_RETRANSMIT_INTERVAL OSPF_RETRANSMIT_INTERVAL
#
#   Every type, default, range and length below is read from the installed template
#   (sha a66388c2f21c5507), never inferred from a sibling parent.
#
# applicable_interface_type / applicable_mode
#   These are DESCRIPTIVE: nothing in the engine or the module reads them -- resolve_binding
#   matches on parent_template alone. They are still set to the module's own vocabulary, since
#   `pol_ind_str = delem["type"] + "_" + profile["mode"]` is what selects the policy, and a
#   reviewer comparing the registry against a playbook should see the same words.
#
# MODULE WIRING
#   This parent had NO engine hook before this slice. Two calls were added to dcnm_interface.py,
#   mirroring the eth path exactly: gie_extend_prof_spec in its validator and
#   gie_contribute_nvpairs in its builder. No feature-specific key was added to either.
#
# THE FIVE AUTHENTICATION FIELDS ARE EXCLUDED
#   ENABLE_OSPF_AUTH, OSPF_AUTH_KEY, OSPF_AUTHENTICATION_KEY, OSPF_AUTH_KEY_ID and
#   OSPF_AUTHENTICATION_KEY_TYPE carry or gate secrets and go in their own lot, on all parents
#   at once, so the mechanism decision is made once rather than three times.
#
# MECHANISM IS passthrough THROUGHOUT
#   None owns a dedicated validation path. test_gie_mechanism_contract.py fails if a child_pti
#   binding is registered without an implementation that actually guards it.
#
# REMOVAL SEMANTICS
#   unresolved, as on int_routed_host: the template creates a child per field and never deletes
#   one. Withdrawal is contract A per the architect, pending s5.

bindings:
  - parent_template: int_subif
    parent_nvpair: ospf
    profile_key: enable_ospf
    applicable_interface_type: sub_int
    applicable_mode: subint
    type: boolean
    reset_wire: 'false'
    default_template: false
    presence_model: two_axis
    emit_when: explicit_only
    mechanism: passthrough
    no_log: false
    min_ndfc_version: 12.6.0.267
    validated_on: 12.6.0.267
    parent_resolution: desired_parent
    removal_semantics: unresolved
    evidence_ref: int_subif.template@a66388c2f21c5507

